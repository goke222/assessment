name: CI Pipeline

on: 
  pull_request:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest

    steps: 
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 15
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: linter(ESLint)
        run: npm run lint

      - name: Test (JEST)
        env: 
          CI: true
        run: npm run test

      - name: Build
        run: npm run build